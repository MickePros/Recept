<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recept</title>
    <link href="Resources/css/reset.css" rel="stylesheet">
    <link href="Resources/css/style.css" rel="stylesheet">
</head>
<body>
    <a href="#main-content" class="skip-link">Hoppa till innehåll</a>

    <header class="page-header">
        <img class="logo" src="/Resources/img/Logo.png" alt aria-hidden="true">
        <nav>
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="/pancakes.html">Recept</a></li>
                <li><a href="#">Om oss</a></li>
                <li class="button"><a href="/submit.html" aria-current="page">Dela recept</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" class="container">

        <form class="share" action="" method="get">
            <h1>Dela ditt recept</h1>
            <p>Här kan du dela ditt recept med oss.</p>

            <fieldset>
                <legend>Om receptet</legend>
                <div>
                    <label for="recepi-name">Receptets namn *</label>
                    <input type="text" id="recepi-name" name="recepi-name" placeholder="Receptets namn" required minlength="3" maxlength="50">
                </div>
                <div>
                    <label for="category">Kategori</label>
                    <select id="category" name="category">
                        <option value="">Välj en kategori</option>
                        <option value="breakfast">Frukost</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Middag</option>
                        <option value="desert">Efterrätt</option>
                        <option value="fika">Fika</option>
                    </select>
                </div>
                <section class="form-double">
                    <div>
                        <label for="time">Tid i minuter</label>
                        <input type="number" id="time" name="time" min="0" step="15">
                    </div>
                    <div>
                        <label for="amount">Antal portioner</label>
                        <input type="number" id="amount" name="amount" min="1">
                    </div>
                </section>
            </fieldset>

            <fieldset>
                <legend>Svårighetsgrad</legend>
                <section class="form-radio">
                    <div>
                        <input type="radio" id="easy" name="experience" value="easy">
                        <label for="easy">Lätt</label>
                    </div>
                    <div>
                        <input type="radio" id="intermediate" name="experience" value="intermediate">
                        <label for="intermediate">Medel</label>
                    </div>
                    <div>
                        <input type="radio" id="hard" name="experience" value="hard">
                        <label for="hard">Svår</label>
                    </div>
                </section>
            </fieldset>

            <fieldset>
                <legend>Receptet</legend>
                <div>
                    <label for="ingredients">Ingredienser</label>
                    <textarea id="ingredients" name="ingredients" rows="2" required></textarea>
                </div>
                <div>
                    <label for="steps">Gör så här</label>
                    <textarea id="steps" name="steps" rows="2" required></textarea>
                </div>
            </fieldset>
            
            <fieldset>
                <legend>Om dig</legend>
                <div>
                    <label for="name">Ditt namn</label>
                    <input type="text" id="name" name="name" placeholder="Namn" minlength="3" maxlength="30">
                </div>
                <div>
                    <label for="email">E-post *</label>
                    <input type="email" id="email" name="email" placeholder="E-post" required>
                </div>
            </fieldset>
            <div class="form-submit">
                <button type="submit">Skicka recept</button>
            </div>
        </form>

    </main>
    <footer>
        <section>
            <figure aria-labelledby="footer-logo">
                <img src="/Resources/img/Logo-alt.png" alt aria-hidden="true">
                <figcaption>Enkla vardagsrecept som alla kan laga.</figcaption>
            </figure>
            <ul aria-labelledby="footer-links">
                <li><a href="#">Om oss</a></li>
                <span>Fler recept</span>
                <li><a href="#">Frukost</a></li>
                <li><a href="#">Middag</a></li>
                <li><a href="#">Efterrätt</a></li>
                <li><a href="#">Fika</a></li>
            </ul>
        </section>
        <section class="copyright" aria-labelledby="footer-copyright">
            <p>Bilder från picsum.photos . @ 2026 Mikael Pros</p>
        </section>
    </footer>
</body>
</html>
